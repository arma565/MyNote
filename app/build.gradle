android {
    namespace 'com.note.mynote'
    compileSdk 34

    defaultConfig {
        applicationId "com.note.mynote"
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin{
        jvmToolchain(21)
    }

    buildFeatures {
        compose = true
        dataBinding =  true
        viewBinding = true
    }
    composeOptions{
        kotlinCompilerExtensionVersion = "1.5.14"
    }
}

