plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.jetbrainsKotlinAndroid)
    alias(libs.plugins.navigation.safeargs)
    alias(libs.plugins.hilt.dagger)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.note.mynote'
    compileSdk 34

    defaultConfig {
        applicationId "com.note.mynote"
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin{
        jvmToolchain(21)
    }

    buildFeatures {
        compose = true
    }
    composeOptions{
        kotlinCompilerExtensionVersion = "1.5.14"
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.android.material
    implementation libs.joda.time
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.test.core
    implementation libs.androidx.junit
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    testImplementation libs.junit
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.espresso.core

    //room
    implementation(libs.room)
    implementation(libs.room.ktx)
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.test.manifest
    ksp(libs.room.compiler.ksp)

    //dagger hilt
    implementation libs.dagger.hilt
    ksp(libs.dagger.hilt.compiler.ksp)

    //coroutine
    implementation(libs.coroutine.android)
    implementation libs.coroutine.core

    //Compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.constraint.layout
    implementation libs.androidx.compose.compiler
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.activity
    implementation libs.androidx.compose.viewmodel
    implementation libs.androidx.compose.livedata
    implementation libs.androidx.compose.icons.core
    implementation libs.androidx.compose.icons.extended
    implementation libs.androidx.compose.window.size
    implementation libs.androidx.compose.navigation
    debugImplementation libs.androidx.compose.debug
    debugImplementation libs.androidx.compose.ui.debug

    // Lifecycle ViewModel
