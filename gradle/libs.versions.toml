composeCompiler = "1.5.14"
composeActivity = "1.9.0"
composeViewModel = "2.8.0"
espressoCore = "3.5.1"

## Plugins versions
agp = "8.4.1"
kotlin = "1.9.24"
navigation = "2.7.7"
hilt = "2.51.1"
ksp = "1.9.24-1.0.20"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
