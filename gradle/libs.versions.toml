joda = "2.12.7"
core = "1.5.0"
junitVersion = "1.1.5"
junit = "4.13.2"
room = "2.6.1"
coroutine = "1.8.1"
viewModelLifeCycle = "2.8.0"
activity = "1.9.0"
fragment = "1.7.1"
